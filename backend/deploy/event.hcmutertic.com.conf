server {
    listen 80;
    listen [::]:80;
    server_name event.hcmutertic.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name event.hcmutertic.com;

    ssl_certificate /etc/letsencrypt/live/event.hcmutertic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/event.hcmutertic.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;

    location / {
        proxy_pass http://192.168.1.17:8512;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6m;
        proxy_read_timeout 60s;
    }
}
