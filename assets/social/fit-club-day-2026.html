<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>FIT Club Day 2026 — ảnh chia sẻ</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 1200px; height: 630px; color: #10254b; background: #fff; font-family: "Segoe UI", Arial, sans-serif; }
    main { position: relative; width: 1200px; height: 630px; overflow: hidden; }
    header { position: relative; z-index: 2; display: flex; align-items: center; gap: 23px; height: 108px; padding: 15px 52px; background: #fff; border-bottom: 1px solid #e3e9f2; }
    header img { width: 66px; height: 76px; object-fit: contain; }
    header .fit { width: 84px; }
    header .rtic { width: 65px; height: 78px; }
    .institution { margin-left: 5px; padding-left: 28px; border-left: 1px solid #cbd5e5; font-size: 16px; font-weight: 600; line-height: 1.65; letter-spacing: .035em; }
    .institution span { display: block; color: #62728a; font-weight: 400; font-size: 15px; letter-spacing: .015em; }
    .copy { position: absolute; inset: 108px 490px 0 0; padding: 38px 0 36px 58px; background: #fff; }
    .eyebrow { margin: 0 0 16px; color: #2861c4; font-size: 17px; letter-spacing: .15em; font-weight: 700; }
    h1 { margin: 0; font-size: 78px; font-weight: 800; line-height: .99; letter-spacing: -.045em; }
    h1 span { display: block; color: #2167d2; margin-top: 6px; }
    .description { margin: 23px 0 0; font-size: 25px; line-height: 1.45; font-weight: 500; }
    .theme { margin: 12px 0 0; color: #61728a; font-size: 20px; }
    footer { position: absolute; left: 58px; bottom: 33px; font-size: 20px; font-weight: 600; letter-spacing: .015em; }
    footer::before { content: ""; display: inline-block; width: 28px; height: 3px; margin: 0 12px 6px 0; background: #2167d2; }
    .visual { position: absolute; right: 0; top: 108px; bottom: 0; width: 490px; background: #0754cf url("../fit-club-day-background-clean.webp") center/cover; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; }
    .event-logo { width: 430px; height: auto; box-shadow: 0 18px 55px #07357d33; }
    .visual p { margin: 35px 0 0; color: #fff; font-weight: 600; font-size: 16px; letter-spacing: .14em; }
    .edge { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: #29cbe0; }
  </style>
</head>
<body>
  <!-- Native branding is only laid out and scaled; original image files are unchanged. -->
  <main>
    <header>
      <img src="../brand/hcmute.png" alt="HCMUTE">
      <img class="fit" src="../brand/fit.png" alt="Khoa Công nghệ Thông tin">
      <img class="rtic" src="../brand/rtic.png" alt="RTIC">
      <div class="institution">KHOA CÔNG NGHỆ THÔNG TIN<span>Trường Đại học Sư phạm Kỹ thuật TP.HCM</span></div>
    </header>
    <section class="copy">
      <p class="eyebrow">NGÀY HỘI CÂU LẠC BỘ</p>
      <h1>FIT CLUB<span>DAY 2026</span></h1>
      <p class="description">Kết nối cộng đồng.<br>Khám phá đam mê công nghệ.</p>
      <p class="theme">Where Tech Meets Dreams</p>
    </section>
    <section class="visual">
      <img class="event-logo" src="../bo-logo/ban-cat-goc/09-club-day-2026.png" alt="Logo gốc FIT Club Day 2026">
      <p>KHÁM PHÁ · KẾT NỐI · TRẢI NGHIỆM</p>
    </section>
    <footer>event.hcmutertic.com</footer>
    <div class="edge"></div>
  </main>
</body>
</html>
